[application]
name = "Delivery Manager Toolbox"
subtitle = "Automatización modular para Delivery Management"

[logging]
level = "INFO"
file = "logs/delivery-manager-toolbox.log"

[jira]
people_file = "config/jira_people.json"

[people360]
source = "sharepoint"
sharepoint_hostname = "everisgroup.sharepoint.com"
