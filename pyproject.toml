[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-manager-toolbox"
version = "0.1.0"
description = "Herramienta local y modular para procesos de Delivery Management"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "pywebview>=6.2,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"delivery_manager_toolbox.modules.jira" = ["assets/*.js"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

